# 線維筋痛症（FM）患者テスト用 Cloud Run デプロイ
# ブランチ: feature/fm-photo-medication
# サービス名: yorisoi-phr-fm-test
#
# 必要な GitHub Secrets（Repository → Settings → Secrets and variables → Actions）:
#   GCP_SA_KEY        … デプロイ用サービスアカウント JSON（Cloud Run Admin 等）
#   GCP_PROJECT_ID    … GCP プロジェクト ID
#   GEMINI_API_KEY    … Gemini API キー（写真抽出用）
#   ALLOW_ORIGIN      … CORS 許可オリジン（例: https://yorisoi.medi-canvas.com）※任意

name: Deploy FM Test (Cloud Run)

on:
  push:
    branches:
      - feature/fm-photo-medication
  workflow_dispatch:

env:
  SERVICE_NAME: yorisoi-phr-fm-test
  REGION: asia-northeast1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::GCP_PROJECT_ID secret is not set"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set"
            exit 1
          fi

      - name: Enable required APIs
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            --quiet

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: .
          flags: --allow-unauthenticated --memory=512Mi
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_MODEL_PRIMARY=gemini-3.1-flash-lite
            GEMINI_MODEL_FALLBACK=gemini-3-flash
            ALLOW_ORIGIN=${{ secrets.ALLOW_ORIGIN }}
            DEMO_MODE=1

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          ORIGIN="${{ secrets.ALLOW_ORIGIN }}"
          if [ -z "$ORIGIN" ]; then
            echo "Note: ALLOW_ORIGIN secret is empty; set it in GitHub Secrets if CORS errors occur."
          fi
          echo "## FM Test Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${URL}?disease=fm" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "患者テスト用リンク: \`${URL}?disease=fm\`" >> "$GITHUB_STEP_SUMMARY"
