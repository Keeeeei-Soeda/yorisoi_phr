# 線維筋痛症（FM）患者テスト用 Cloud Run デプロイ
# ブランチ: feature/fm-photo-medication
# サービス名: yorisoi-phr-fm-test
#
# 必要な GitHub Secrets（Repository → Settings → Secrets and variables → Actions）:
#   GCP_SA_KEY        … デプロイ用サービスアカウント JSON（Cloud Run Admin 等）
#   GCP_PROJECT_ID    … GCP プロジェクト ID
#   GEMINI_API_KEY    … Gemini API キー（写真抽出用）
#   ALLOW_ORIGIN      … CORS 許可オリジン（例: https://yorisoi.medi-canvas.com）※任意

name: Deploy FM Test (Cloud Run)

on:
  push:
    branches:
      - feature/fm-photo-medication
  workflow_dispatch:

env:
  SERVICE_NAME: yorisoi-phr-fm-test
  REGION: asia-northeast1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::GCP_PROJECT_ID secret is not set"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set"
            exit 1
          fi

      - name: Enable required APIs
        continue-on-error: true
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            --quiet || echo "::warning::Could not enable APIs (need Service Usage Admin or enable manually in GCP Console)"

      - name: Deploy to Cloud Run
        id: deploy
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOW_ORIGIN: ${{ secrets.ALLOW_ORIGIN }}
        run: |
          set -euxo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          ORIGIN="${ALLOW_ORIGIN:-*}"
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --source . \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID},GEMINI_API_KEY=${GEMINI_API_KEY},GEMINI_MODEL_PRIMARY=gemini-3.1-flash-lite,GEMINI_MODEL_FALLBACK=gemini-3-flash,ALLOW_ORIGIN=${ORIGIN},DEMO_MODE=1" \
            --quiet

          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format 'value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          ORIGIN="${{ secrets.ALLOW_ORIGIN }}"
          if [ -z "$ORIGIN" ]; then
            echo "Note: ALLOW_ORIGIN secret is empty; set it in GitHub Secrets if CORS errors occur."
          fi
          echo "## FM Test Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${URL}?disease=fm" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "患者テスト用リンク: \`${URL}?disease=fm\`" >> "$GITHUB_STEP_SUMMARY"
